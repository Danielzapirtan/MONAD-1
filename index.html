<!DOCTYPE html>
<html>
<head>
<style>
  .preview-container {
    width: 100%;
    height: 600px;
    border: 2px solid #ccc;
    margin-top: 20px;
  }
  .preview-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .link-list a {
    display: inline-block;
    margin: 5px 10px;
    padding: 10px 15px;
    background: #007bff;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .link-list a:hover {
    background: #0056b3;
  }
</style>
</head>
<body>

<div class="link-list">
  <a onclick="previewLink('http://127.0.0.1:5030')">MONAD</a>
  <a onclick="previewLink('http://127.0.0.1:5034')">bfc</a>
  <a onclick="previewLink('http://127.0.0.1:5005')">vd3</a>
  <a onclick="previewLink('https://pdfutils-tau.vercel.app')">pdfutils</a>
</div>

<div class="preview-container">
  <iframe id="previewFrame" src="about:blank"></iframe>
</div>

<script>
function previewLink(url) {
  document.getElementById('previewFrame').src = url;
}
</script>
</body>
</html>
