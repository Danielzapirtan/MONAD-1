<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Downloader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h1>Video Downloader</h1>

  <div class="source-tabs">
    <button class="tab-btn active" data-tab="youtube">YouTube URL</button>
    <button class="tab-btn" data-tab="upload">Upload File</button>
  </div>

  <div id="tab-youtube" class="tab-panel">
    <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">
    <label class="checkbox-label">
      <input type="checkbox" id="useCookies">
      Authenticate with local Chrome cookies
    </label>
    <button id="loadYoutubeBtn">Load Video</button>
  </div>

  <div id="tab-upload" class="tab-panel hidden">
    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div id="status"></div>

  <div id="videoSection" class="hidden">
    <video id="preview" controls></video>
    
    <div class="download-actions">
      <button id="downloadBtn">Download Video</button>
      <div id="fileInfo"></div>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
